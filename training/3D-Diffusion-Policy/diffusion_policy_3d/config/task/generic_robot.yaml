name: generic_robot
task_name: generic_robot

shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [1024, 3]
      type: point_cloud
    agent_pos:
      shape: [54]
      type: low_dim
  action:
    shape: [54]

env_runner: null

dataset:
  _target_: diffusion_policy_3d.dataset.generic_dp3_dataset.GenericDP3Dataset
  zarr_path: data/robot_dp3.zarr
  expected_num_points: 1024
  expected_dim: 54
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.1
  grouped_validation: false
  point_cloud_noise_std: 0.0
  max_train_episodes: null
